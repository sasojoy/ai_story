const CLINIC = new Set(["yingchuan", "runan", "wan_city", "zhuo_county", "xiaquyang", "baima_temple"]);
const MARKET = new Set(["zhuo_county", "runan_market", "wan_city", "xiaquyang"]);
const SMITH = new Set(Object.values(P).filter((p) => p.kind === "town").map((p) => p.id));
const GOALS = new Set(["changshe", "guan_camp"]); // 劇情層：這一幕的目標（假）
const NEWS = new Set(["wan_city", "xiaquyang", "runan_wilds"]); // 最近的大事與傳聞（假）
const PEOPLE = { changshe: ["皇甫嵩", "朱儁"], huangjin_camp: ["波才"], guangzong: ["張角", "張梁"], luzhi_camp: ["盧植"], nanyang_huangjin_camp: ["張曼成"], xiaquyang: ["張寶"] };
const SQUADS = { guan: ["官軍巡騎", "郡國兵"], huang: ["黃巾嘍囉", "黃巾別部"], haoqiang: ["涿郡義勇", "塢堡部曲"], none: ["流寇散兵", "山匪"] };

function oddsWord(p) {
  const side = ctrlAt(NOW, p.id);
  if (side === ME.side) return { word: "自家地盤", tone: "safe" };
  return [null, { word: "穩勝", tone: "safe" }, { word: "有把握", tone: "ok" }, { word: "難分勝負", tone: "risk" }][p.danger] || { word: "五五波", tone: "ok" };
}
function sortieOf(p, side = ME.side) {
  if (!LINE_OF[p.id] && !BASES[p.id] && !FIXED[p.id]) return null;
  if (!LINE_OF[p.id] && !FIXED[p.id]) return null; // 大本營不在可易手的戰線上：沒有出陣
  const holder = ctrlAt(NOW, p.id);
  if (side === "haoqiang") return "攪局";
  return holder === side ? "守" : "攻";
}
function priceWord(p) {
  const holder = ctrlAt(NOW, p.id);
  if (!holder) return "";
  return holder === ME.side ? "自家地盤：療傷、打造、買馬便宜一成" : "別人的地盤：療傷、打造、買馬貴兩成";
}
function services(p) {
  return [CLINIC.has(p.id) && "醫館", SMITH.has(p.id) && "鐵匠鋪", MARKET.has(p.id) && "馬市"].filter(Boolean);
}

// ── 輿圖的三種畫風（a2.html 與 a2-畫風.html 共用；同一張圖、同一套資料，只換畫法）──
// 甲：精緻設色山水（現在的方向往上一層）　乙：印與旗（借草圖 C 的印章）　丙：古輿圖（計里畫方、方框地名）
// base() 畫不跟倍率走的底（紙、大區、山河、路）；marks() 畫跟倍率、週次、濾鏡走的（勢力、前線、地點、字、你）。
// k＝1／倍率：字與記號乘它，螢幕上看起來大小固定。
const ART = (() => {
  const SERIF = '"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif';
  const KAI = '"BiauKai","DFKai-SB","KaiTi","STKaiti","Kaiti TC",serif';
  const SANS = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  const GLYPH = { town: "城", camp: "營", roof: "寺", ferry: "渡", peak: "山", flag: "野" };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const poly = (pts) => "M" + pts.map((p) => p.join(" ")).join("L") + "Z";
  const smooth = (pts) => { // Catmull-Rom → 三次曲線：河要圓順
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += `C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
    }
    return d;
  };
  const road = (a, b) => `M${a.x} ${a.y}Q${(a.x + b.x) / 2 + (b.y - a.y) * 0.08} ${(a.y + b.y) / 2 - (b.x - a.x) * 0.08} ${b.x} ${b.y}`;
  const along = (pts, step, fn) => { // 沿著山脊每隔 step 放一個
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1], n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / step));
      for (let j = 0; j < n; j++) fn(ax + ((bx - ax) * j) / n, ay + ((by - ay) * j) / n, i * 31 + j);
    }
  };
  const majority = (rid, week) => {
    const n = {};
    for (const p of Object.values(P)) if (p.region === rid) { const c = ctrlAt(week, p.id); if (c) n[c] = (n[c] || 0) + 1; }
    return n;
  };
  const top = (n) => Object.entries(n).sort((a, b) => b[1] - a[1])[0]?.[0] || null;

  const STYLES = {
    jia: { name: "甲・精緻設色山水", note: "現在的設色山水往上一層：絹紋與四角壓暗、青綠疊色的山、雙線官道、州界點劃線；地盤是暈開的顏色，前線是紅色鋸線。" },
    yi: { name: "乙・印與旗", note: "淡墨山水打底、楷書地名；誰佔著是一顆印（官、巾、豪），可易手的地點插一面旗；地盤是淡淡的水色暈染，前線是朱砂粗筆。" },
    bing: { name: "丙・古輿圖", note: "像宋代石刻輿圖：計里畫方的格子、褐色線條、山畫成「∧」、河是雙線、地名框在方框裡；地盤是斜線網紋，前線是粗墨界線。" },
  };

  function defs(style) {
    const noise = (a) => `<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .34  0 0 0 0 .22  0 0 0 ${a} 0"/></filter>`;
    const out = [noise(style === "bing" ? 0.16 : 0.1)];
    out.push(`<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".65" stop-color="#5A4632" stop-opacity="0"/><stop offset="1" stop-color="#5A4632" stop-opacity="${style === "yi" ? 0.12 : 0.22}"/></radialGradient>`);
    for (const [k, s] of Object.entries(SIDES)) {
      out.push(`<radialGradient id="halo-${k}"><stop offset="0" stop-color="${s.soft}" stop-opacity=".7"/><stop offset=".55" stop-color="${s.soft}" stop-opacity=".35"/><stop offset="1" stop-color="${s.soft}" stop-opacity="0"/></radialGradient>`);
      out.push(`<pattern id="hatch-${k}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="9" height="9" fill="${s.tint}" opacity=".55"/><line x1="0" y1="0" x2="0" y2="9" stroke="${s.color}" stroke-width="2.4" opacity=".55"/></pattern>`);
    }
    out.push('<linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3F7564"/><stop offset=".6" stop-color="#7DA38A"/><stop offset="1" stop-color="#B7CDA9"/></linearGradient>');
    out.push('<linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FB0A0"/><stop offset="1" stop-color="#CFDCC4"/></linearGradient>');
    out.push('<filter id="wash" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>');
    out.push('<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>');
    out.push('<pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#7A5C36" stroke-width="1" opacity=".22"/></pattern>');
    return `<defs>${out.join("")}</defs>`;
  }

  // ── 底 ──
  function base(style, ctx) {
    const W = DATA.W, H = DATA.H, out = [];
    const paper = { jia: "#EFE6CF", yi: "#F3EDDC", bing: "#E7DABA" }[style];
    out.push(`<rect width="${W}" height="${H}" fill="${paper}"/><rect width="${W}" height="${H}" filter="url(#paper)"/>`);
    if (style === "bing") out.push(`<rect width="${W}" height="${H}" fill="url(#grid)"/>`);
    // 大區
    for (const r of REGIONS) {
      const lead = ctx.ctrlOn ? top(majority(r.id, ctx.week)) : null;
      if (style === "jia") out.push(`<path d="${poly(r.pts)}" fill="${lead ? SIDES[lead].tint : "#E6DEC6"}" fill-opacity=".55" stroke="#A88F62" stroke-width="2.2" stroke-dasharray="12 4 2 4"/>`);
      if (style === "yi") out.push(`<path d="${poly(r.pts)}" fill="none" stroke="#B9A882" stroke-width="1.4" stroke-dasharray="3 5"/>`);
      if (style === "bing") out.push(`<path d="${poly(r.pts)}" fill="none" stroke="#7A5C36" stroke-width="3.4"/><path d="${poly(r.pts)}" fill="none" stroke="${paper}" stroke-width="1.2"/>`);
    }
    // 山與林
    for (const [kind, , pts, sz] of DATA.terrain) {
      if (kind === "forest") {
        const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]), x0 = Math.min(...xs), y0 = Math.min(...ys), dx = Math.max(...xs) - x0, dy = Math.max(...ys) - y0;
        for (let i = 0; i < 16; i++) {
          const x = x0 + (((i * 37) % 100) / 100) * dx, y = y0 + (((i * 61) % 100) / 100) * dy;
          if (style === "jia") out.push(`<path d="M${x} ${y + 9}V${y + 3}" stroke="#5A4630" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="6.5" fill="#7FA585" stroke="#3E6448" stroke-width="1.1"/>`);
          if (style === "yi") out.push(`<circle cx="${x}" cy="${y}" r="9" fill="#5E6E58" opacity=".22" filter="url(#soft)"/>`);
          if (style === "bing") out.push(`<path d="M${x} ${y + 7}V${y - 1}M${x - 5} ${y + 2}L${x} ${y - 6}L${x + 5} ${y + 2}" fill="none" stroke="#6B5131" stroke-width="1.3"/>`);
        }
        continue;
      }
      const hill = kind === "hills";
      along(pts, sz * (style === "bing" ? 0.9 : 1.25), (x, y, i) => {
        const h = sz * (hill ? 0.65 : 1 + (i % 3) * 0.2);
        if (style === "jia") {
          out.push(`<path d="M${x - h * 1.05 + 6} ${y + h * 0.5}L${x + 6} ${y - h * 0.8}L${x + h * 1.05 + 6} ${y + h * 0.5}Z" fill="url(#mtn2)"/>`);
          out.push(`<path d="M${x - h * 0.85} ${y + h * 0.5}Q${x - h * 0.3} ${y - h * 0.4} ${x} ${y - h}Q${x + h * 0.35} ${y - h * 0.35} ${x + h * 0.85} ${y + h * 0.5}Z" fill="url(#mtn)" stroke="#2F5245" stroke-width="1.5" stroke-linejoin="round"/>`);
          out.push(`<path d="M${x} ${y - h}Q${x - h * 0.08} ${y - h * 0.4} ${x - h * 0.3} ${y + h * 0.3}" fill="none" stroke="#E8EFE0" stroke-width="1.2" opacity=".8"/>`);
        }
        if (style === "yi") {
          out.push(`<ellipse cx="${x}" cy="${y}" rx="${h * 1.5}" ry="${h * 0.8}" fill="#2F2A24" opacity=".2" filter="url(#soft)"/>`);
          out.push(`<path d="M${x - h * 1.1} ${y + h * 0.4}Q${x - h * 0.4} ${y - h * 1.1} ${x} ${y - h * 0.85}T${x + h * 1.2} ${y + h * 0.4}" fill="none" stroke="#2F2A24" stroke-width="1.7" opacity=".55" stroke-linecap="round"/>`);
        }
        if (style === "bing") out.push(`<path d="M${x - h * 0.6} ${y + h * 0.3}L${x} ${y - h * 0.55}L${x + h * 0.6} ${y + h * 0.3}" fill="none" stroke="#6B5131" stroke-width="1.6" stroke-linejoin="round"/>`);
      });
    }
    // 河
    for (const [, pts, color] of DATA.rivers) {
      const d = smooth(pts), yellow = color === "yellow";
      if (style === "jia") out.push(`<path d="${d}" fill="none" stroke="${yellow ? "#D3B36B" : "#86AFCB"}" stroke-width="${yellow ? 15 : 8}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${yellow ? "#EBD9A8" : "#C9DEEA"}" stroke-width="${yellow ? 5 : 2.6}" stroke-linecap="round"/>`);
      if (style === "yi") out.push(`<path d="${d}" fill="none" stroke="${yellow ? "#B49E70" : "#7F98A8"}" stroke-width="${yellow ? 16 : 9}" opacity=".35" stroke-linecap="round" filter="url(#soft)"/><path d="${d}" fill="none" stroke="${yellow ? "#8E7A50" : "#5E7787"}" stroke-width="1.6" opacity=".7"/>`);
      if (style === "bing") out.push(`<path d="${d}" fill="none" stroke="${yellow ? "#8A6B3A" : "#4E6E86"}" stroke-width="${yellow ? 9 : 6}"/><path d="${d}" fill="none" stroke="${paper}" stroke-width="${yellow ? 5 : 3}"/>`);
    }
    // 路
    for (const [a, b, kind] of DATA.edges) {
      const d = road(P[a], P[b]), main = kind === "官道";
      if (style === "jia") out.push(main
        ? `<path d="${d}" fill="none" stroke="#8C6A3F" stroke-width="5.2" opacity=".75"/><path d="${d}" fill="none" stroke="#F1E7CF" stroke-width="2.2"/>`
        : `<path d="${d}" fill="none" stroke="#8C6A3F" stroke-width="2" stroke-dasharray="6 5" opacity=".75"/>`);
      if (style === "yi") out.push(`<path d="${d}" fill="none" stroke="#3A332A" stroke-width="${main ? 2.4 : 1.5}" stroke-dasharray="${main ? "12 3 3 3" : "7 4 2 4"}" opacity=".55" stroke-linecap="round"/>`);
      if (style === "bing") out.push(`<path d="${d}" fill="none" stroke="#6B5131" stroke-width="${main ? 2.2 : 1.3}" stroke-dasharray="${main ? "0" : "4 4"}" opacity=".85"/>`);
    }
    // 近看時的大區名（地圖本身的字，跟著縮放）
    for (const r of REGIONS) {
      if (style === "jia") out.push(`<text x="${r.lx}" y="${r.ly}" font-family='${SERIF}' font-size="30" font-weight="700" letter-spacing="10" fill="#7A6A55" opacity=".45">${r.name}</text>`);
      if (style === "yi") out.push(`<text x="${r.lx}" y="${r.ly}" font-family='${KAI}' font-size="32" letter-spacing="12" fill="#2F2A24" opacity=".28">${r.name}</text>`);
      if (style === "bing") { const w = r.name.length * 26 + 18; out.push(`<rect x="${r.lx - 9}" y="${r.ly - 26}" width="${w}" height="36" fill="${paper}" stroke="#7A5C36" stroke-width="1.6"/><text x="${r.lx}" y="${r.ly + 1}" font-family='${SERIF}' font-size="24" letter-spacing="2" fill="#5A4630">${r.name}</text>`); }
    }
    out.push(`<rect width="${W}" height="${H}" fill="url(#vig)"/>`);
    return out.join("");
  }

  // ── 記號：勢力、前線、地點、字、你 ──
  // ctx: { week, k, far, ctrlOn, sel, me, flash:Set, badges(id)->[[text, color]], label(id)->string }
  function marks(style, ctx) {
    const { week, k, far, ctrlOn } = ctx, out = [];
    // 勢力
    if (ctrlOn) for (const p of Object.values(P)) {
      const c = ctrlAt(week, p.id);
      if (!c) continue;
      if (style === "jia") out.push(`<circle cx="${p.x}" cy="${p.y}" r="80" fill="url(#halo-${c})"/>`);
      if (style === "yi") out.push(`<circle cx="${p.x}" cy="${p.y}" r="58" fill="${SIDES[c].soft}" opacity=".5" filter="url(#wash)"/>`);
      if (style === "bing") out.push(`<circle cx="${p.x}" cy="${p.y}" r="44" fill="url(#hatch-${c})"/>`);
    }
    // 前線：兩方地盤相接的路
    if (ctrlOn) for (const [a, b] of DATA.edges) {
      const ca = ctrlAt(week, a), cb = ctrlAt(week, b);
      if (!ca || !cb || ca === cb) continue;
      const A = P[a], B = P[b], long = Math.hypot(A.x - B.x, A.y - B.y) > 200, mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
      if (style === "jia") {
        out.push(`<path d="M${A.x} ${A.y}L${B.x} ${B.y}" stroke="#A8322A" stroke-width="${3.6 * Math.max(1, k * 0.8)}" stroke-dasharray="${2 * k} ${3 * k}" fill="none"/>`);
        if (!long) out.push(`<text x="${mx}" y="${my + 6 * k}" font-size="${15 * k}" text-anchor="middle">⚔</text>`);
      }
      if (style === "yi") out.push(`<path d="M${A.x} ${A.y}L${B.x} ${B.y}" stroke="#A8322A" stroke-width="${Math.max(7, 5 * k)}" stroke-linecap="round" stroke-dasharray="${18 * k} ${4 * k} ${7 * k} ${4 * k}" opacity=".85" fill="none"/>`);
      if (style === "bing") out.push(`<path d="M${A.x} ${A.y}L${B.x} ${B.y}" stroke="#2B1F14" stroke-width="${Math.max(4.5, 3.4 * k)}" stroke-dasharray="${10 * k} ${4 * k} ${2 * k} ${4 * k}" fill="none"/><path d="M${A.x} ${A.y}L${B.x} ${B.y}" stroke="#A8322A" stroke-width="${1.4 * k}" fill="none"/>`);
    }
    // 看大局：大區名字、誰佔幾處（三色長條）
    if (far) for (const r of REGIONS) {
      const n = majority(r.id, week), total = Object.values(n).reduce((a, b) => a + b, 0), font = style === "yi" ? KAI : SERIF;
      out.push(`<text x="${r.cx}" y="${r.cy - 14 * k}" text-anchor="middle" font-family='${font}' font-size="${23 * k}" font-weight="700" fill="#2B241B" stroke="#F7F1E3" stroke-width="${5 * k}" paint-order="stroke" letter-spacing="${3 * k}">${r.name}</text>`);
      if (total) {
        let x = r.cx - 40 * k;
        for (const side of ["guan", "huang", "haoqiang"]) {
          if (!n[side]) continue;
          const w = (80 * k * n[side]) / total;
          out.push(`<rect x="${x}" y="${r.cy - 4 * k}" width="${w}" height="${9 * k}" fill="${SIDES[side].color}"/>`);
          x += w;
        }
        out.push(`<rect x="${r.cx - 40 * k}" y="${r.cy - 4 * k}" width="${80 * k}" height="${9 * k}" fill="none" stroke="#F7F1E3" stroke-width="${1.5 * k}"/>`);
        out.push(`<text x="${r.cx}" y="${r.cy + 20 * k}" text-anchor="middle" font-size="${12 * k}" fill="#3A332A" stroke="#F7F1E3" stroke-width="${3 * k}" paint-order="stroke" font-family='${SANS}'>${["guan", "huang", "haoqiang"].filter((s) => n[s]).map((s) => `${SIDES[s].short} ${n[s]}`).join("・")}</text>`);
      } else out.push(`<text x="${r.cx}" y="${r.cy + 6 * k}" text-anchor="middle" font-size="${12 * k}" fill="#6D5E48" font-family='${SANS}'>無人佔據</text>`);
    }
    // 地點
    for (const p of Object.values(P)) {
      const c = ctrlAt(week, p.id), cc = ctrlOn ? c : null, line = !!LINE_OF[p.id], base = !!BASES[p.id];
      if (ctx.flash && ctx.flash.has(p.id)) out.push(`<circle class="pulse" cx="${p.x}" cy="${p.y}" r="16" fill="none" stroke="#A8322A" stroke-width="${3 * k}"/>`);
      const r = far ? 6 * k : Math.max(11, 8 * k);
      if (ctx.sel === p.id) out.push(`<circle cx="${p.x}" cy="${p.y}" r="${r + 9 * k}" fill="none" stroke="#2B241B" stroke-width="${3 * k}"/>`);
      out.push(`<g data-loc="${p.id}">`);
      if (far) {
        out.push(`<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${cc ? SIDES[cc].color : "#A99C84"}" stroke="#F7F1E3" stroke-width="${1.5 * k}"/></g>`);
        continue;
      }
      const col = cc ? SIDES[cc].color : style === "bing" ? "#5A4630" : "#7A6A55";
      if (style === "jia") {
        out.push(`<circle cx="${p.x}" cy="${p.y}" r="${r + 2.5 * k}" fill="none" stroke="${col}" stroke-width="${1.2 * k}" opacity=".7"/><circle cx="${p.x}" cy="${p.y}" r="${r}" fill="#FBF6EA" stroke="${col}" stroke-width="${2.8 * Math.max(1, k * 0.7)}"/>`);
        out.push(`<text x="${p.x}" y="${p.y + r * 0.36}" text-anchor="middle" font-size="${r * 1.02}" fill="${col}" font-weight="700" font-family='${SERIF}'>${GLYPH[p.kind]}</text>`);
      }
      if (style === "yi") {
        if (cc) {
          const s = (base ? 22 : 18) * k;
          if (line) out.push(`<path d="M${p.x + s * 0.5} ${p.y - s * 0.5}V${p.y - s * 2}" stroke="#3A332A" stroke-width="${1.4 * k}"/><path d="M${p.x + s * 0.5} ${p.y - s * 2}L${p.x + s * 1.6} ${p.y - s * 1.65}L${p.x + s * 0.5} ${p.y - s * 1.3}Z" fill="${SIDES[cc].color}"/>`);
          out.push(`<g transform="rotate(-6 ${p.x} ${p.y})"><rect x="${p.x - s / 2}" y="${p.y - s / 2}" width="${s}" height="${s}" rx="${2 * k}" fill="${SIDES[cc].color}"${base ? ` stroke="#2B241B" stroke-width="${1.2 * k}"` : ""}/><text x="${p.x}" y="${p.y + s * 0.3}" text-anchor="middle" font-size="${s * 0.72}" fill="#FFF8EC" font-family='${KAI}' font-weight="700">${SIDES[cc].short}</text></g>`);
        } else out.push(`<circle cx="${p.x}" cy="${p.y}" r="${5.5 * k}" fill="#2B241B"/><circle cx="${p.x}" cy="${p.y}" r="${8.5 * k}" fill="none" stroke="#2B241B" stroke-width="${1 * k}" opacity=".45"/>`);
      }
      if (style === "bing") {
        const s = r * 1.1;
        if (p.kind === "town") out.push(`<rect x="${p.x - s}" y="${p.y - s}" width="${2 * s}" height="${2 * s}" fill="#F1E7CC" stroke="${col}" stroke-width="${2.6 * k}"/><rect x="${p.x - s * 0.55}" y="${p.y - s * 0.55}" width="${s * 1.1}" height="${s * 1.1}" fill="none" stroke="${col}" stroke-width="${1.2 * k}"/>`);
        else if (p.kind === "camp") out.push(`<path d="M${p.x - s} ${p.y + s * 0.8}L${p.x} ${p.y - s}L${p.x + s} ${p.y + s * 0.8}Z" fill="#F1E7CC" stroke="${col}" stroke-width="${2.4 * k}"/>`);
        else out.push(`<circle cx="${p.x}" cy="${p.y}" r="${s * 0.75}" fill="#F1E7CC" stroke="${col}" stroke-width="${2.2 * k}"/>`);
      }
      out.push("</g>");
      // 地名與疊上去的小牌子
      const label = ctx.label(p.id), fs = 13 * k;
      const lx = p.x + r + (style === "yi" && cc && line ? 18 : 5) * k;
      if (style === "bing") {
        const w = (label.length * 13 + 8) * k;
        out.push(`<rect x="${lx - 3 * k}" y="${p.y - 10 * k}" width="${w}" height="${18 * k}" fill="#F1E7CC" stroke="#6B5131" stroke-width="${0.9 * k}"/><text x="${lx + 1 * k}" y="${p.y + 4 * k}" font-size="${fs}" fill="#3A2C1C" font-family='${SERIF}'>${esc(label)}</text>`);
      } else out.push(`<text x="${lx}" y="${p.y + 4.5 * k}" font-size="${(style === "yi" ? 14.5 : 13) * k}" font-weight="${p.big ? 700 : 500}" fill="#2B241B" stroke="#F7F1E3" stroke-width="${3.4 * k}" paint-order="stroke" font-family='${style === "yi" ? KAI : SERIF}'>${esc(label)}</text>`);
      let bx = lx;
      for (const [t, color] of ctx.badges(p.id)) { // 濾鏡疊上去的小牌子：一排、各自一個顏色
        const w = (t.length * 10.5 + 10) * k;
        out.push(`<rect x="${bx - 2 * k}" y="${p.y + 9 * k}" width="${w}" height="${15 * k}" rx="${7.5 * k}" fill="${color}"/><text x="${bx + 3 * k}" y="${p.y + 20 * k}" font-size="${10.5 * k}" fill="#FFF" font-family='${SANS}'>${t}</text>`);
        bx += w + 3 * k;
      }
    }
    // 你
    const h = P[ctx.me];
    out.push(`<circle class="pulse" cx="${h.x}" cy="${h.y}" r="16" fill="none" stroke="#A8322A" stroke-width="${2.5 * k}"/>`);
    out.push(`<path d="M${h.x + 4 * k} ${h.y - 12 * k}V${h.y - 40 * k}L${h.x + 22 * k} ${h.y - 33 * k}L${h.x + 4 * k} ${h.y - 26 * k}" fill="#A8322A" stroke="#7A1F18" stroke-width="${1.5 * k}"/>`);
    return out.join("");
  }
  return { STYLES, defs, base, marks, esc };
})();

// 外框：手機／桌機切換（只在寬螢幕出現）。切了之後通知草圖重新量大小
(function () {
  const dev = document.getElementById("dev");
  const bar = document.querySelector(".devbar");
  if (!dev || !bar) return;
  bar.addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-mode]");
    if (!b) return;
    for (const x of bar.querySelectorAll("button")) x.classList.toggle("on", x === b);
    dev.classList.toggle("desk", b.dataset.mode === "desk");
    window.dispatchEvent(new Event("devicechange"));
  });
})();

(function () {
  const ORDERS = { guan_camp: "守城", runan_wilds: "攻城" };
  let week = NOW;
  const near = { x: 330, y: 790, w: 400, h: 430 };
  const label = (id) => NAME_SHORT(P[id].name) + (id === ME.at ? "（你）" : "");
  const badges = (id) => (ORDERS[id] ? [[`令 ${ORDERS[id]}`, "#A8322A"]] : []);
  // 同一頁有六張圖：每一張的 id 加上自己的尾巴，不然後面的圖會借用第一張的紙紋與漸層
  let serial = 0;
  const uniq = (str) => { const t = `-${++serial}`; return str.replace(/id="([\w-]+)"/g, `id="$1${t}"`).replace(/url\(#([\w-]+)\)/g, `url(#$1${t})`); };
  function svg(style, view, k, far) {
    const flash = week !== NOW ? new Set(HISTORY.events[week].changed.map((e) => e.id)) : null;
    return uniq(`<svg viewBox="${view.x} ${view.y} ${view.w} ${view.h}" xmlns="http://www.w3.org/2000/svg">${ART.defs(style)}${ART.base(style, { week, ctrlOn: true })}${ART.marks(style, { week, k, far, ctrlOn: true, sel: null, me: ME.at, flash, badges: far ? () => [] : badges, label })}</svg>`);
  }
  function render() {
    document.getElementById("weekbar").innerHTML = "看第幾週：" + Array.from({ length: NOW }, (_, i) => `<button data-w="${i + 1}" class="${i + 1 === week ? "on" : ""}">${i + 1}</button>`).join("") +
      `<span style="color:var(--page-mute)">${HISTORY.events[week].big.join("・")}</span>`;
    document.getElementById("cols").innerHTML = Object.entries(ART.STYLES).map(([key, st]) => `<section class="col"><h2>${st.name}</h2><p>${st.note}</p>
      <div class="cap">近看・潁川汝南一帶</div>${svg(key, near, near.w / 340, false)}
      <div class="cap">拉遠・看大局</div>${svg(key, { x: 0, y: 0, w: DATA.W, h: DATA.H }, DATA.W / 300, true)}</section>`).join("");
  }
  document.getElementById("weekbar").addEventListener("click", (ev) => { const b = ev.target.closest("[data-w]"); if (b) { week = +b.dataset.w; render(); } });
  render();
})();
</script>
